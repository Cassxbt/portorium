[project]
name = "portorium"
version = "0.1.0"
description = "Tariff classification that refuses without a living precedent"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "numpy>=2.0", "fastapi>=0.115", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["portorium"]

[project.scripts]
portorium = "portorium.cli:main"
