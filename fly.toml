# The public demo: sample mode only (recorded service responses, no keys on the server).
app = "portorium"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  SAMPLE_MODE = "true"
  PORT = "7860"

[http_service]
  internal_port = 7860
  force_https = true
  # Kept running through judging so no visitor waits for a cold start.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
